        - course_name
        - teacher
        - notes
        - sessions
      properties:
        courseId:
          type: string
          description: 講義（コース）ID
        course_name:
          type: string
          description: 講義名
        teacher:
          type: string
          description: 担当教員名
        notes:
          type: string
          description: 特記事項・お知らせ
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/LectureSessionDetail'
          description: 各回セッション（講義コマ）の配列

    DistributionPdfItem:
      type: object
      required:
