    LectureAttendanceRegistration:
      type: object
      required:
        - available
        - lectureId
        - passwordInputId
        - passwordInputName
        - submitAction
        - submitButtonText
        - submitDisabled
      properties:
        available:
          type: boolean
          description: 出席登録フォームが表示されているか
        lectureId:
          type: string
          description: 出席登録対象の講義回ID
        passwordInputId:
          type: string
          description: 出席パスワード入力欄のid属性
        passwordInputName:
          type: string
          description: 出席パスワード入力欄のname属性
        submitAction:
          type: string
          description: 画面上の出席登録ボタンのonclick属性
        submitButtonText:
          type: string
          description: 画面上の出席登録ボタンの表示テキスト
        submitDisabled:
          type: boolean
          description: 出席登録ボタンが無効化されているか

    CourseLectureAttendanceRequest:
      type: object
      required:
        - lectureId
        - password
      properties:
        lectureId:
          type: string
          description: 出席登録対象の講義回ID
        password:
          type: string
          description: 出席パスワード

    CourseLectureAttendanceResult:
      type: object
      required:
        - success
        - message
        - raw
      properties:
        success:
          type: boolean
