        limit:
          type: integer
          description: 1ページあたりの取得上限数
        hasNextPage:
          type: boolean
          description: 次のページが存在するかどうか
        hasPreviousPage:
          type: boolean
          description: 前のページが存在するかどうか

    PaginatedReceivedOfficeMemos:
